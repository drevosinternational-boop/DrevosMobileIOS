name: DrevosIOS
options:
  bundleIdPrefix: com.drevos
  deploymentTarget:
    iOS: "16.0"

configs:
  Debug: debug
  Release: release

configFiles:
  Debug: Config/Generated.xcconfig
  Release: Config/Generated.xcconfig

packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk.git
    exactVersion: 12.17.0
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    exactVersion: 9.2.0

targets:
  DrevosIOS:
    type: application
    platform: iOS
    deploymentTarget: "16.0"

    # IMPORTANT:
    # Do NOT add the entire DrevosIOS/Resources directory here.
    # XcodeGen's `info:` block creates DrevosIOS/Resources/Info.plist.
    # If the whole Resources directory is also copied as resources, Xcode can
    # attempt both ProcessInfoPlistFile and Copy Bundle Resources for Info.plist,
    # producing "Multiple commands produce .../Info.plist".
    sources:
      - path: DrevosIOS
        excludes:
          - Resources

      # Only actual bundle resources are listed explicitly.
      - path: DrevosIOS/Resources/Assets.xcassets
        buildPhase: resources

      - path: DrevosIOS/Resources/GoogleService-Info.plist
        buildPhase: resources

    info:
      path: DrevosIOS/Resources/Info.plist
      properties:
        CFBundleDisplayName: DREVOS
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLSchemes:
              - "$(GOOGLE_REVERSED_CLIENT_ID)"

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: mobile.ios
        PRODUCT_NAME: DREVOS
        SWIFT_VERSION: 6.0
        IPHONEOS_DEPLOYMENT_TARGET: 16.0
        TARGETED_DEVICE_FAMILY: 1
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        VERSIONING_SYSTEM: apple-generic
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        OTHER_LDFLAGS: "$(inherited) -ObjC"

    dependencies:
      - package: Firebase
        product: FirebaseCore
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseDatabase
      - package: GoogleSignIn
        product: GoogleSignIn

    scheme:
      gatherCoverageData: false
